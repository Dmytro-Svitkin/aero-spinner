    <title>Aero Spinner Demo</title>
    <link rel="icon"href="./assets/aero-spinner-2-animated-0.75s.svg">
    <style>
        @keyframes colorCycle{
            0%{background-color:crimson}
            14%{background-color:coral}
            29%{background-color:khaki}
            43%{background-color:mediumseagreen}
            57%{background-color:deepskyblue}
            71%{background-color:royalblue}
            86%{background-color:indigo}
            93%{background-color:darkmagenta}
            100%{background-color:crimson}
        }

        body{
            margin:0;
            height:100dvh;
            display:flex;
            justify-content:center;
            align-items:center;
            animation:colorCycle 20s infinite ease-in-out
        }
        table{
            border-collapse:collapse;
            border-spacing:0
        }

        tr,td{
            padding:0;
            margin:0;
            line-height:0
        }

        img{
            margin:4px;
        }
    </style>
</head>
